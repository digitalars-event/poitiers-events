name: Build events JSON

on:
  schedule:
    - cron: "0 */6 * * *" # exécution toutes les 6 heures
  workflow_dispatch:        # permet le déclenchement manuel

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-dateutil ics charset-normalizer

      - name: Run aggregator script
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: |
          python scripts/aggregator.py

      - name: Commit and push updated events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add events.json
          git commit -m "chore: update events.json" || echo "No changes to commit"
          git push
