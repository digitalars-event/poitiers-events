name: Build events JSON

on:
  schedule:
    - cron: "0 */6 * * *" # exécution toutes les 6 heures
  workflow_dispatch:        # permet le déclenchement manuel

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --- 1️⃣ Clonage du dépôt ---
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # important pour permettre le rebase

      # --- 2️⃣ Configuration de Python ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --- 3️⃣ Installation des dépendances ---
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- 4️⃣ Exécution du script d’agrégation ---
      - name: Run aggregator script
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: |
          python scripts/aggregator.py

      # --- 5️⃣ Synchronisation locale avec la branche main distante ---
      - name: Sync with remote main (avoid push rejection)
        run: |
          git fetch origin main
          git rebase origin/main || true

      # --- 6️⃣ Commit et push des modifications ---
      - name: Commit and push updated events.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add events.json

          # Commit uniquement si des changements existent
          git diff --cached --quiet || git commit -m "chore: update events.json"

          # Push sécurisé avec gestion des conflits
          git pull --rebase origin main || true
          git push origin main || (git pull --rebase origin main && git push origin main)
