<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Événements à Poitiers et alentours</title>
<style>
:root {
  --brand: #097d4c;
  --brand-2: #13b46d;
  --blue: #3b82f6;
  --border: #ddd;
  --text: #111;
  --muted: #666;
}
body { font-family: system-ui; margin:0; background:#f8f9fa; color:var(--text); }
.hero { background:#097d4c; color:#fff; text-align:center; padding:40px 0; }
.wrap { max-width:1100px; margin:auto; padding:20px; }
.grid { display:grid; grid-template-columns:1fr; gap:20px; }
@media(min-width:800px){ .grid{grid-template-columns:1fr 1fr 1fr;} }

.card { background:#fff; border:1px solid var(--border); border-radius:16px; overflow:hidden; box-shadow:0 2px 5px rgba(0,0,0,.1); transition:.2s; display:flex; flex-direction:column; }
.card:hover { transform:translateY(-3px); box-shadow:0 5px 15px rgba(0,0,0,.15); }
.cover { position:relative; aspect-ratio:16/9; background:#eee center/cover no-repeat; }
.date-badge { position:absolute; top:10px; left:10px; background:#fff; border:1px solid var(--border); border-radius:10px; padding:6px 10px; font-size:13px; color:var(--brand); font-weight:600; }
.date-badge.etab { color:#fff; background:var(--blue); border:none; }
.card h3 { margin:12px 14px 0; font-size:17px; }
.meta { font-size:13px; color:var(--muted); margin:8px 14px; }
.actions { margin:auto 14px 14px; }
.btn { display:inline-block; background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; padding:8px 12px; border-radius:10px; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<div class="hero"><h1>Événements à Poitiers et alentours</h1></div>
<div class="wrap">
  <div class="grid" id="grid"></div>
</div>

<script>
function relDays(iso){
  if(!iso) return "";
  var d=new Date(iso), t=new Date();
  t.setHours(0,0,0,0); d.setHours(0,0,0,0);
  var diff=Math.round((d-t)/86400000);
  if(diff===0) return "Aujourd'hui";
  if(diff===1) return "Demain";
  if(diff<0) return Math.abs(diff)+" j passés";
  return "Dans "+diff+" j";
}

async function loadEvents(){
  const r = await fetch('./events.json?v='+Date.now(), {cache:'no-store'});
  return r.ok ? await r.json() : {events:[]};
}

function render(data){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  (data.events||[]).forEach(e=>{
    const img=`<div class="cover" style="background-image:url('${e.image||''}')">
      ${e.date_start ? 
        `<div class="date-badge">${relDays(e.date_start)}</div>` :
        `<div class="date-badge etab">Établissement</div>`}
    </div>`;
    const html=`
      ${img}
      <h3>${e.title}</h3>
      <div class="meta">${e.location||''}</div>
      <div class="actions">
        <a href="${e.link}" target="_blank" class="btn">Voir la fiche →</a>
      </div>`;
    const el=document.createElement('article');
    el.className='card';
    el.innerHTML=html;
    grid.appendChild(el);
  });
}

(async()=>{
  const data=await loadEvents();
  render(data);
})();
</script>
</body>
</html>
