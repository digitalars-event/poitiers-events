<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Événements à Poitiers et alentours – Prototype</title>

    <style>
      :root {
        --bg: #f7f7f7;
        --panel: #ffffff;
        --muted: #555;
        --text: #111;
        --brand: #097d4c;
        --brand-2: #13b46d;
        --ok: #097d4c;
        --danger: #ef4444;
        --card: #fff;
        --chip: #f2f2f2;
        --border: #ddd;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial;
        margin: 0;
      }

      a {
        color: var(--brand);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .hero {
        background-image: url('https://www.hifrance.org/wp-content/uploads/2025/10/Poitiers-Site-HI-Banniere.jpg');
        background-size: cover;
        background-position: center;
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      }

      .hero h1 {
        background: rgba(0, 0, 0, 0.3);
        padding: 12px 24px;
        border-radius: 12px;
        font-size: clamp(26px, 3vw, 36px);
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 16px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
        margin-top: 16px;
      }

      @media (min-width: 680px) {
        .grid { grid-template-columns: 1fr 1fr; }
      }

      @media (min-width: 1000px) {
        .grid { grid-template-columns: 1fr 1fr 1fr; }
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      }

      .cover {
        position: relative;
        aspect-ratio: 16 / 9;
        background-size: cover;
        background-position: center;
        background-color: #eee;
      }

      .badge {
        position: absolute;
        top: 10px;
        left: 10px;
        background: white;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 6px 10px;
        font-size: 12px;
        color: var(--brand);
        font-weight: 600;
      }

      .content {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .content h3 {
        margin: 0;
        font-size: 16.5px;
      }

      .meta {
        font-size: 13px;
        color: var(--muted);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip {
        background: var(--chip);
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 12px;
        padding: 4px 8px;
        color: var(--muted);
      }

      .actions {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 0 14px 14px 14px;
      }

      .btn {
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 10px;
        cursor: pointer;
        text-decoration: none;
        font-weight: 600;
      }

      .ghost {
        border: 1px solid var(--brand);
        background: transparent;
        color: var(--brand);
        padding: 8px 12px;
        border-radius: 10px;
        text-decoration: none;
      }

      footer {
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        margin: 24px 0;
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <h1>Événements à Poitiers et alentours</h1>
    </div>

    <div class="wrap">
      <section class="grid" id="grid"></section>
      <footer>
        ✦ Données issues de <strong>events.json</strong> généré automatiquement via GitHub Actions.
      </footer>
    </div>

    <script>
      async function loadEvents() {
        const r = await fetch('./events.json?v=' + Date.now(), { cache: 'no-store' });
        return r.ok ? await r.json() : { events: [] };
      }

      function daysUntil(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        const now = new Date();
        const diff = Math.ceil((d - now) / 86400000);
        if (diff < 0) return '';
        if (diff === 0) return 'Aujourd’hui';
        if (diff === 1) return 'Demain';
        return 'J-' + diff;
      }

      function render(items) {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        if (!items.length) {
          grid.innerHTML = '<div class="panel empty">Aucun film trouvé.</div>';
          return;
        }

        items.forEach(ev => {
          // Vérif si film CGR
          if (ev.cinema && ev.cinema.includes("CGR")) {
            const poster = ev.poster || ev.image || '';
            const rel = daysUntil(ev.release);
            const genres = ev.genres || 'Genres non précisés';
            const desc = ev.description || ev.synopsis || '—';

            const html = `
              <article class="card">
                <div class="cover" style="background-image:url('${poster}');">
                  ${rel ? `<div class="badge">${rel}</div>` : ''}
                </div>
                <div class="content">
                  <h3>${ev.title}</h3>
                  <div class="meta">
                    ${ev.cinema} · ${genres} · ${ev.duration || 'Durée inconnue'}
                  </div>
                  <p style="font-size:13px; line-height:1.5;">${desc}</p>
                  <div class="chips">
                    ${ev.release ? `<span class="chip">Sortie : ${new Date(ev.release).toLocaleDateString('fr-FR')}</span>` : ''}
                  </div>
                </div>
                <div class="actions">
                  <a class="ghost" href="${ev.source}" target="_blank">Site CGR</a>
                  <a class="btn" href="${ev.source}" target="_blank">Voir les horaires 🎟️</a>
                </div>
              </article>
            `;
            grid.insertAdjacentHTML('beforeend', html);
          }
        });
      }

      (async function() {
        const data = await loadEvents();
        render(data.events || []);
      })();
    </script>
  </body>
</html>
