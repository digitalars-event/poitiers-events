<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Événements à Poitiers et alentours – Prototype</title>

    <style>
      :root {
        --bg: #f7f7f7;
        --panel: #ffffff;
        --muted: #555;
        --text: #111;
        --brand: #097d4c;
        --brand-2: #13b46d;
        --ok: #097d4c;
        --danger: #ef4444;
        --card: #fff;
        --chip: #f2f2f2;
        --border: #ddd;
        --blue: #007bff;
        --blue-light: #e8f0ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial;
        margin: 0;
      }

      a {
        color: var(--brand);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .hero {
        background-image: url('https://www.hifrance.org/wp-content/uploads/2025/10/Poitiers-Site-HI-Banniere.jpg');
        background-size: cover;
        background-position: center;
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      }

      .hero h1 {
        background: rgba(0, 0, 0, 0.3);
        padding: 12px 24px;
        border-radius: 12px;
        font-size: clamp(26px, 3vw, 36px);
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 16px;
      }

      header.top {
        display: grid;
        gap: 12px;
        grid-template-columns: 1fr;
        margin-top: 16px;
        margin-bottom: 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        box-shadow: 0 0 10px rgba(9, 125, 76, 0.4);
      }

      .subtitle {
        color: var(--muted);
        font-size: 14px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px;
      }

      .filters {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      @media (min-width: 720px) {
        header.top {
          grid-template-columns: 2fr 3fr;
          align-items: center;
        }

        .filters {
          grid-template-columns: 1.2fr 1.2fr 1fr 1fr 1fr;
        }
      }

      input,
      select {
        width: 100%;
        background: #fff;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        outline: none;
      }

      label {
        font-size: 12px;
        color: var(--muted);
        display: block;
        margin-bottom: 6px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        background: var(--chip);
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 12px;
        color: var(--muted);
      }

      .chip.ok {
        color: var(--brand);
        border-color: var(--brand-2);
        background: #eafaf2;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
        margin-top: 16px;
      }

      @media (min-width: 680px) {
        .grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (min-width: 1000px) {
        .grid {
          grid-template-columns: 1fr 1fr 1fr;
        }
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: clip;
        display: flex;
        flex-direction: column;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
      }

      .card .cover {
        aspect-ratio: 16 / 9;
        position: relative;
        background-size: cover;
        background-position: center;
      }

      .card .cover .badge {
        position: absolute;
        left: 10px;
        top: 10px;
        background: #fff;
        border: 1px solid var(--border);
        padding: 6px 10px;
        border-radius: 10px;
        font-size: 12px;
        color: var(--brand);
      }

      .card .content {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .card h3 {
        margin: 0;
        font-size: 17px;
      }

      .meta {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .actions {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 0 14px 14px 14px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        border: none;
        color: #fff;
        font-weight: 700;
        padding: 10px 12px;
        border-radius: 12px;
        cursor: pointer;
      }

      .ghost {
        background: transparent;
        color: var(--brand);
        border: 1px solid var(--brand);
        padding: 10px 12px;
        border-radius: 12px;
        cursor: pointer;
      }

      .empty {
        text-align: center;
        color: var(--muted);
        padding: 28px 0;
      }

      footer {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        margin: 24px 0;
      }
    </style>
  </head>

  <body>
    <div class="hero">
      <h1>Événements à Poitiers et alentours</h1>
    </div>

    <div class="wrap">
      <header class="top">
        <div class="brand">
          <span class="dot"></span>
          <div>
            <div class="subtitle">Prototype clair – données JSON dynamiques (GitHub Actions)</div>
          </div>
        </div>

        <div class="chips" id="liveInfo">
          <span class="chip">Dernière màj : <span id="lastUpdate">—</span></span>
          <span class="chip ok" id="countChip">0 élément(s)</span>
          <span class="chip">Poitiers · Grand Poitiers · 25 km</span>
        </div>
      </header>

      <section class="panel">
        <div class="filters">
          <div>
            <label for="q">Rechercher</label>
            <input id="q" type="search" placeholder="concert, expo, film..." />
          </div>

          <div>
            <label for="cat">Catégorie</label>
            <select id="cat">
              <option value="">Toutes</option>
              <option>Musique</option>
              <option>Exposition</option>
              <option>Film</option>
              <option>Festival</option>
            </select>
          </div>

          <div>
            <label for="type">Type</label>
            <select id="type">
              <option value="">Tous</option>
              <option value="evenement">Événements</option>
              <option value="cgr">CGR Cinémas</option>
            </select>
          </div>

          <div>
            <label for="from">À partir du</label>
            <input id="from" type="date" />
          </div>

          <div>
            <label for="freeOnly">
              <input id="freeOnly" type="checkbox" /> Gratuit uniquement
            </label>
          </div>
        </div>
      </section>

      <section class="grid" id="grid"></section>

      <footer>
        <p>✦ Données générées automatiquement via GitHub Actions (events.json).</p>
      </footer>
    </div>

    <script>
      function slug(x) {
        return x?.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
      }

      async function loadEvents() {
        const r = await fetch('./events.json?v=' + Date.now(), { cache: 'no-store' });
        return r.ok ? await r.json() : { events: [] };
      }

      function render(items) {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        if (!items.length) {
          grid.innerHTML = '<div class="panel empty">Aucun élément trouvé.</div>';
          return;
        }

        items.forEach(ev => {
          let html = '';

          // 🎬 Spécial CGR
          if (ev.cinema && ev.cinema.includes("CGR")) {
            html = `
              <div class="cover" style="background-image:url('${ev.poster}');">
                <div class="badge">${ev.cinema}</div>
              </div>
              <div class="content">
                <h3>${ev.title}</h3>
                <div class="meta">${ev.genres || 'Genre inconnu'} · ${ev.duration}</div>
                <p style="font-size:13px; line-height:1.4;">${ev.description || '—'}</p>
                <div class="chips">
                  <span class="chip">Sortie : ${new Date(ev.release).toLocaleDateString('fr-FR')}</span>
                </div>
              </div>
              <div class="actions">
                <a class="ghost" href="${ev.source}" target="_blank">Voir sur CGR</a>
                <a class="btn" href="${ev.source}" target="_blank">Horaires 🎟️</a>
              </div>`;
          } else {
            // autres événements
            html = `
              <div class="content">
                <h3>${ev.title}</h3>
                <div class="meta">${ev.location || 'Poitiers'}</div>
                <p style="font-size:13px;">${ev.description || ''}</p>
              </div>`;
          }

          const el = document.createElement('article');
          el.className = 'card';
          el.innerHTML = html;
          grid.appendChild(el);
        });
      }

      function applyFilters(data) {
        const q = slug(document.getElementById('q').value);
        const cat = document.getElementById('cat').value;
        const type = document.getElementById('type').value;
        const freeOnly = document.getElementById('freeOnly').checked;

        let items = data.events || [];

        items = items.filter(e => !freeOnly || e.price === 0);
        if (cat) items = items.filter(e => (e.genres || '').includes(cat));
        if (type === 'cgr') items = items.filter(e => e.cinema && e.cinema.includes('CGR'));
        if (type === 'evenement') items = items.filter(e => !e.cinema);

        if (q) {
          items = items.filter(e => slug(e.title).includes(q));
        }

        document.getElementById('countChip').textContent = items.length + ' élément(s)';
        render(items);
      }

      (async function () {
        const data = await loadEvents();
        document.getElementById('lastUpdate').textContent = new Date().toLocaleString('fr-FR');
        ['q', 'cat', 'type', 'from', 'freeOnly'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.addEventListener('input', () => applyFilters(data));
        });
        applyFilters(data);
      })();
    </script>
  </body>
</html>
