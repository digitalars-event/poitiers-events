<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Événements CGR, Arena, Republic Corner & Parc Expo – Poitiers</title>

    <style>
      :root {
        --bg: #f7f7f7;
        --panel: #ffffff;
        --muted: #555;
        --text: #111;
        --brand: #097d4c;
        --brand-2: #13b46d;
        --border: #ddd;
        --card: #fff;
      }

      * { box-sizing: border-box; }

      html, body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial;
        margin: 0;
      }

      .hero {
        background-image: url('https://www.hifrance.org/wp-content/uploads/2025/10/Poitiers-Site-HI-Banniere.jpg');
        background-size: cover;
        background-position: center;
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      }

      .hero h1 {
        background: rgba(0,0,0,0.3);
        padding: 12px 24px;
        border-radius: 12px;
        font-size: clamp(26px, 3vw, 36px);
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 16px;
      }

      .section-title {
        margin-top: 30px;
        margin-bottom: 12px;
        font-size: 20px;
        font-weight: 700;
        color: var(--brand);
        border-left: 5px solid var(--brand);
        padding-left: 8px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
        margin-top: 16px;
      }

      @media (min-width: 700px) {
        .grid { grid-template-columns: 1fr 1fr; }
      }

      @media (min-width: 1000px) {
        .grid { grid-template-columns: 1fr 1fr 1fr; }
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      }

      .cover {
        position: relative;
        aspect-ratio: 16 / 9;
        background-size: cover;
        background-position: center;
      }

      .badge {
        position: absolute;
        top: 10px;
        left: 10px;
        background: white;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 6px 10px;
        font-size: 12px;
        color: var(--brand);
        font-weight: 600;
      }

      .content {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .content h3 {
        margin: 0;
        font-size: 16.5px;
      }

      .meta {
        font-size: 13px;
        color: var(--muted);
      }

      .synopsis {
        font-size: 13px;
        line-height: 1.5;
        color: var(--text);
        max-height: 3.5em;
        overflow: hidden;
        position: relative;
        transition: max-height 0.4s ease;
      }

      .synopsis.expanded {
        max-height: 300px;
      }

      .toggle-btn {
        background: none;
        border: none;
        color: var(--brand);
        font-weight: 600;
        cursor: pointer;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0;
      }

      .toggle-btn::after {
        content: "▼";
        font-size: 11px;
        transition: transform 0.3s ease;
      }

      .toggle-btn.active::after {
        transform: rotate(180deg);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip {
        background: #f3f3f3;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 12px;
        padding: 4px 8px;
        color: var(--muted);
      }

      .actions {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 0 14px 14px 14px;
      }

      .btn {
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 10px;
        cursor: pointer;
        text-decoration: none;
        font-weight: 600;
      }

      .ghost {
        border: 1px solid var(--brand);
        background: transparent;
        color: var(--brand);
        padding: 8px 12px;
        border-radius: 10px;
        text-decoration: none;
      }

      footer {
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        margin: 24px 0;
      }
    </style>
  </head>

  <body>
    <div class="hero">
      <h1>Événements à Poitiers</h1>
    </div>

    <div class="wrap">
      <h2 class="section-title">🎬 Films à l'affiche (CGR)</h2>
      <section class="grid" id="gridCGR"></section>

      <h2 class="section-title">🎤 Concerts & Spectacles (Arena)</h2>
      <section class="grid" id="gridArena"></section>

      <h2 class="section-title">🎭 Soirées & Humour (Republic Corner)</h2>
      <section class="grid" id="gridRC"></section>

      <h2 class="section-title">🏛️ Événements (Parc Expo Grand Poitiers)</h2>
      <section class="grid" id="gridExpo"></section>

      <footer>✦ Données issues de <strong>events.json</strong> (CGR, Arena, Republic Corner & Parc Expo).</footer>
    </div>

    <script>
      async function loadEvents() {
        const r = await fetch('./events.json?v=' + Date.now(), { cache: 'no-store' });
        return r.ok ? await r.json() : { events: [] };
      }

      function daysUntil(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        const now = new Date();
        const diff = Math.ceil((d - now) / 86400000);
        if (diff < 0) return '';
        if (diff === 0) return 'Aujourd’hui';
        if (diff === 1) return 'Demain';
        return 'J-' + diff;
      }

      function cleanArenaDate(text) {
        if (!text) return '';
        return text.replace(/^.*?(dimanche|lundi|mardi|mercredi|jeudi|vendredi|samedi)/i, '$1');
      }

      function renderCGR(events) {
        const grid = document.getElementById('gridCGR');
        grid.innerHTML = '';
        const sorted = events.filter(ev => ev.cinema?.includes("CGR"))
          .sort((a, b) => new Date(a.release || 0) - new Date(b.release || 0));

        sorted.forEach(ev => {
          const poster = ev.poster || ev.image || '';
          const rel = daysUntil(ev.release);
          const genres = ev.genres || 'Genres non précisés';
          const desc = ev.description || ev.synopsis || '—';
          grid.insertAdjacentHTML('beforeend', `
            <article class="card">
              <div class="cover" style="background-image:url('${poster}');">
                ${rel ? `<div class="badge">${rel}</div>` : ''}
              </div>
              <div class="content">
                <h3>${ev.title}</h3>
                <div class="meta">${ev.cinema} · ${genres} · ${ev.duration || 'Durée inconnue'}</div>
                <p class="synopsis">${desc}</p>
                <button class="toggle-btn">Voir plus</button>
              </div>
              <div class="actions">
                <a class="ghost" href="${ev.source}" target="_blank">Site CGR</a>
                <a class="btn" href="${ev.source}" target="_blank">Voir les horaires</a>
              </div>
            </article>`);
        });
      }

      function renderArena(events) {
        const grid = document.getElementById('gridArena');
        grid.innerHTML = '';
        const sorted = events.filter(ev => ev.cinema?.includes("Arena"))
          .sort((a, b) => new Date(a.release || 0) - new Date(b.release || 0));

        sorted.forEach(ev => {
          const poster = ev.poster || ev.image || '';
          const rel = daysUntil(ev.release);
          const date = cleanArenaDate(ev.date);
          grid.insertAdjacentHTML('beforeend', `
            <article class="card">
              <div class="cover" style="background-image:url('${poster}');">
                ${rel ? `<div class="badge">${rel}</div>` : ''}
              </div>
              <div class="content">
                <h3>${ev.title}</h3>
                <div class="meta">Arena Futuroscope · ${date}</div>
              </div>
              <div class="actions">
                <a class="ghost" href="${ev.source}" target="_blank">Plus d'infos</a>
                <a class="btn" href="${ev.reservation}" target="_blank">Réserver</a>
              </div>
            </article>`);
        });
      }

      function renderRC(events) {
        const grid = document.getElementById('gridRC');
        grid.innerHTML = '';
        const sorted = events.filter(ev => ev.cinema?.includes("Republic"))
          .sort((a, b) => new Date(a.date || 0) - new Date(b.date || 0));

        sorted.forEach(ev => {
          const poster = ev.poster || '';
          const rel = daysUntil(ev.date);
          const desc = (ev.description || '').substring(0, 300) + '...';
          grid.insertAdjacentHTML('beforeend', `
            <article class="card">
              <div class="cover" style="background-image:url('${poster}');">
                ${rel ? `<div class="badge">${rel}</div>` : ''}
              </div>
              <div class="content">
                <h3>${ev.title}</h3>
                <div class="meta">${ev.address || 'Espace Republic Corner, Poitiers'}</div>
                <p class="synopsis">${desc}</p>
                <button class="toggle-btn">Voir plus</button>
              </div>
              <div class="actions">
                <a class="ghost" href="${ev.source}" target="_blank">Billetterie</a>
                <a class="btn" href="${ev.source}" target="_blank">Réserver</a>
              </div>
            </article>`);
        });
      }

      function renderExpo(events) {
        const grid = document.getElementById('gridExpo');
        grid.innerHTML = '';
      
        const sorted = events
          .filter(ev => ev.cinema?.includes("Parc Expo"))
          .sort((a, b) => new Date(a.date || 0) - new Date(b.date || 0));
      
        sorted.forEach(ev => {
          const poster = ev.poster || '';
          const rel = daysUntil(ev.date);
      
          // Formater la date de manière lisible
          const dateText = ev.date
            ? new Date(ev.date).toLocaleDateString('fr-FR', {
                weekday: 'long',
                day: '2-digit',
                month: 'long',
                year: 'numeric',
              })
            : 'Date non précisée';
      
          grid.insertAdjacentHTML('beforeend', `
            <article class="card">
              <div class="cover" style="background-image:url('${poster}');">
                ${rel ? `<div class="badge">${rel}</div>` : ''}
              </div>
      
              <div class="content">
                <h3>${ev.title}</h3>
                <div class="meta">Parc Expo Grand Poitiers</div>
              </div>
      
              <div class="date-block" 
                   style="background:#f3f3f3; color:#333; font-size:13px; 
                          font-weight:600; text-align:center; 
                          padding:8px; border-top:1px solid #ddd;">
                ${dateText}
              </div>
      
              <div class="actions">
                <a class="ghost" href="${ev.source}" target="_blank">Plus d'infos</a>
                <a class="btn" href="${ev.source}" target="_blank">Voir l'événement</a>
              </div>
            </article>
          `);
        });
      }


      (async function() {
        const data = await loadEvents();
        renderCGR(data.events || []);
        renderArena(data.events || []);
        renderRC(data.events || []);
        renderExpo(data.events || []);

        document.addEventListener('click', e => {
          if (e.target.classList.contains('toggle-btn')) {
            const p = e.target.previousElementSibling;
            p.classList.toggle('expanded');
            e.target.classList.toggle('active');
            e.target.textContent = p.classList.contains('expanded') ? 'Voir moins' : 'Voir plus';
          }
        });
      })();
    </script>
  </body>
</html>
